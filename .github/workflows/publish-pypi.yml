name: Publish fie-sdk to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      # STRICT: model files are not in git, so a wheel built from a bare
      # checkout would ship without them and `pip install fie-sdk` local mode
      # would silently degrade to regex-only detection. Fail the release
      # instead — publish the models release first (see docs/OPERATIONS.md).
      - name: Download model artifacts (strict)
        run: python scripts/download_models.py --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The archive gate (WP-021 Stage 3.3c). Both distributions are judged by
      # their actual members against scripts/model_manifest.json: under
      # fie/models/ exactly the in_wheel: true artifacts, byte for byte, plus
      # the derived fie/models/MANIFEST.json, and nothing else. The wheel that is
      # published is the one built from the sdist that passed. Any failure stops
      # the job here, before anything is published.
      - name: Build the sdist
        run: python -m build --sdist --outdir dist

      - name: Verify the sdist (model allowlist and build inputs)
        run: |
          sdists=(dist/*.tar.gz)
          [ "${#sdists[@]}" -eq 1 ] && [ -f "${sdists[0]}" ] || { echo "expected exactly one sdist, found: ${sdists[*]}"; exit 2; }
          python scripts/verify_package_artifacts.py --sdist "${sdists[0]}"

      - name: Build the wheel from the verified sdist
        run: |
          sdists=(dist/*.tar.gz)
          rm -rf "$RUNNER_TEMP/sdist-src" && mkdir -p "$RUNNER_TEMP/sdist-src"
          tar -xzf "${sdists[0]}" -C "$RUNNER_TEMP/sdist-src"
          srcs=("$RUNNER_TEMP"/sdist-src/*/)
          [ "${#srcs[@]}" -eq 1 ] || { echo "the sdist must unpack to one directory"; exit 2; }
          python -m build --wheel --outdir dist "${srcs[0]}"

      - name: Verify the sdist and the wheel before publishing (model allowlist and digests)
        run: |
          sdists=(dist/*.tar.gz); wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "expected exactly one wheel, found: ${wheels[*]}"; exit 2; }
          files=(dist/*)
          [ "${#files[@]}" -eq 2 ] || { echo "dist/ must hold exactly the verified sdist and wheel, found: ${files[*]}"; exit 2; }
          sha256sum "${sdists[0]}" "${wheels[0]}"
          python scripts/verify_package_artifacts.py --sdist "${sdists[0]}" --wheel "${wheels[0]}"

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
